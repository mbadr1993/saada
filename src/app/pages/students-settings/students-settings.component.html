<div class="w-full h-full flex flex-col gap-4 p-4">
  <div class="flex flex-col">
    <h1 class="text-3xl font-bold text-emerald-800">الطلاب</h1>
    <p class="text-gray-600 mt-2">
      هنا يمكنك استعراض و تعديل بيانات الطلاب او اضافه طلاب جدد ...
    </p>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <div>
      <app-card>
        <!-- Student Card Details (Themed) -->
        <div class="relative group">
          <!-- Action Icons (Edit & Delete) -->
          <div
            class="absolute -bottom-3 -end-3 flex opacity-100 transition-opacity duration-200 md:opacity-0 md:group-hover:opacity-100"
          >
            <button
              title="تعديل الطالب"
              class="hover:bg-emerald-100 transition-colors p-2 rounded-full"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5 stroke-emerald-700"
                viewBox="0 0 24 24"
                fill="none"
              >
                <path
                  d="M14.3601 4.07866L15.2869 3.15178C16.8226 1.61607 19.3125 1.61607 20.8482 3.15178C22.3839 4.68748 22.3839 7.17735 20.8482 8.71306L19.9213 9.63993M14.3601 4.07866C14.3601 4.07866 14.4759 6.04828 16.2138 7.78618C17.9517 9.52407 19.9213 9.63993 19.9213 9.63993M14.3601 4.07866L12 6.43872M19.9213 9.63993L14.6607 14.9006L11.5613 18L11.4001 18.1612C10.8229 18.7383 10.5344 19.0269 10.2162 19.2751C9.84082 19.5679 9.43469 19.8189 9.00498 20.0237C8.6407 20.1973 8.25352 20.3263 7.47918 20.5844L4.19792 21.6782M4.19792 21.6782L3.39584 21.9456C3.01478 22.0726 2.59466 21.9734 2.31063 21.6894C2.0266 21.4053 1.92743 20.9852 2.05445 20.6042L2.32181 19.8021M4.19792 21.6782L2.32181 19.8021M2.32181 19.8021L3.41556 16.5208C3.67368 15.7465 3.80273 15.3593 3.97634 14.995C4.18114 14.5653 4.43213 14.1592 4.7249 13.7838C4.97308 13.4656 5.26166 13.1771 5.83882 12.5999L8.5 9.93872"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
              </svg>
            </button>
            <button
              title="حذف الطالب"
              class="hover:bg-red-100 transition-colors p-2 rounded-full"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5 stroke-red-700"
                viewBox="0 0 24 24"
                fill="none"
              >
                <path
                  d="M9.17065 4C9.58249 2.83481 10.6937 2 11.9999 2C13.3062 2 14.4174 2.83481 14.8292 4"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
                <path
                  d="M20.5 6H3.49988"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
                <path
                  d="M18.3735 15.3991C18.1965 18.054 18.108 19.3815 17.243 20.1907C16.378 21 15.0476 21 12.3868 21H11.6134C8.9526 21 7.6222 21 6.75719 20.1907C5.89218 19.3815 5.80368 18.054 5.62669 15.3991L5.16675 8.5M18.8334 8.5L18.6334 11.5"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
                <path
                  d="M9.5 11L10 16"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
                <path
                  d="M14.5 11L14 16"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>
          <!-- Student Name and Age -->
          <h2 class="text-2xl font-bold text-emerald-800 mb-1">
            اسم الطالب: محمد أحمد
          </h2>
          <p class="text-gray-700 mb-1">العمر: 16 سنة</p>
          <!-- Father's Name -->
          <p class="text-gray-600 mb-2">اسم الأب: أحمد علي</p>
          <!-- Phone Number Link -->
          <a
            href="tel:0123456789"
            class="text-emerald-700 hover:underline flex items-center gap-1 font-medium"
          >
            <i class="fas fa-phone-alt"></i>
            0123456789
          </a>
        </div>
      </app-card>
    </div>
  </div>
</div>
